[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-videogen"
version = "0.1.0"
description = "Idea to Video CLI powered by Google Veo3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["google", "veo3", "video-generation", "ai", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-genai",
    "Pillow",
    "requests",
]

[project.optional-dependencies]
tts = ["kokoro", "numpy"]
mcp = ["mcp[cli]"]
dev = ["pytest", "ruff"]

[project.scripts]
gemini-videogen     = "gemini_videogen.cli:main"
gemini-videogen-mcp = "gemini_videogen.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemini_videogen*"]

[tool.ruff]
line-length = 100
